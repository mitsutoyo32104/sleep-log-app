<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- グラデーション（背景） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- グラデーション（月・発光） -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- グラデーション（波形・データ） -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- 影と光のフィルター効果 -->
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- アイコンベース（角丸四角形） -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#appShadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25"/>

  <!-- 三日月モチーフ -->
  <path d="M 290,110 
           C 180,110 110,195 110,300 
           C 110,390 175,420 250,420 
           C 210,390 190,340 190,290 
           C 190,190 260,135 340,130 
           C 320,116 305,110 290,110 Z" 
        fill="url(#moonGrad)" filter="url(#glow)"/>

  <!-- 睡眠データ（波形）モチーフ -->
  <path d="M 180,310 
           Q 220,250 260,290 
           T 340,270 
           Q 370,255 390,285 
           C 350,370 270,390 200,360 
           Q 185,335 180,310 Z" 
        fill="url(#waveGrad)" opacity="0.9" />

  <!-- 重ね加工用の波形アクセント -->
  <path d="M 210,325 
           Q 245,280 280,310 
           T 355,295 
           C 330,365 265,375 210,350 Z" 
        fill="#A7F3D0" opacity="0.6"/>

  <!-- 星の光アクセント -->
  <circle cx="370" cy="140" r="6" fill="#FDE047" opacity="0.9" filter="url(#glow)"/>
  <circle cx="320" cy="90" r="4" fill="#FDE047" opacity="0.7"/>
  <circle cx="410" cy="190" r="5" fill="#6EE7B7" opacity="0.8"/>
</svg>
